name: Release
on:
  push:
    tags:
      - 'v0.2.5'
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/tags/v0.2.5'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: python -m pip install -c constraints.txt -e '.[build]'
      - run: npm ci --prefix src/computer_bridge/native
      - run: npm ci --prefix gateway
      - run: npm run check --prefix gateway
      - run: python scripts/source_integrity.py
      - name: Build verified public components
        run: python scripts/build_release.py --release-version 0.2.5
      - name: Check every release asset
        run: python scripts/verify_release.py dist/release-0.2.5
      - name: Require new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.5 >/dev/null 2>&1; then
            echo "Release already exists; never replace its resources."
            exit 1
          fi
      - name: Publish verified components
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp docs/release-0.2.5.md release-notes.txt
          printf '\nSource commit: %s\n' "$GITHUB_SHA" >> release-notes.txt
          gh release create v0.2.5 --verify-tag --target "$GITHUB_SHA" --title 0.2.5 --notes-file release-notes.txt dist/release-0.2.5/*
