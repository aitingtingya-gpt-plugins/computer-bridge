[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "computer-bridge-work-tree"
version = "0.2.5b0"
description = "Optional Work Tree connection module for Computer Bridge"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
dependencies = ["computer-bridge>=0.1.5,<=0.2.5b0"]

[project.entry-points."computer_bridge.modules"]
work-tree = "computer_bridge_work_tree:WorkTreeModule"

[tool.hatch.build.targets.wheel]
packages = ["src/computer_bridge_work_tree"]

[tool.hatch.build]
exclude = ["**/__pycache__/**", "**/*.pyc"]
